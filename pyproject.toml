[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldnote-diagnostics"
version = "0.1.0"
description = "Local host diagnostics with an Antigravity-powered analysis UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
api = ["google-genai>=1.0,<3"]

[project.scripts]
fieldnote = "fieldnote.cli:main"

[tool.setuptools]
packages = ["fieldnote"]

[tool.setuptools.package-data]
fieldnote = ["index.html"]
