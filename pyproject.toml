[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldnote-diagnostics"
version = "0.4.1"
description = "Windows diagnostic agent with evidence planning, policy pipelines and local UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3", "psutil>=5.9,<8"]

[project.scripts]
fieldnote = "fieldnote.cli:main"

[tool.setuptools.packages.find]
include = ["fieldnote*", "diagnostic_intelligence*"]

[tool.setuptools.package-data]
fieldnote = ["index.html"]
